name: Build Spellbound

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Spellbound.exe (MinGW, static)
        shell: bash
        run: g++ -std=c++17 -O2 -Wall -static spellbound.cpp -o Spellbound.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Spellbound-windows
          path: Spellbound.exe
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Spellbound.exe

  unix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: g++ -std=c++17 -O2 -Wall -Wextra spellbound.cpp -o spellbound
      - name: Smoke test (new game, then quit)
        run: printf 'CI Wizard\n\n4\n' | ./spellbound > /dev/null
